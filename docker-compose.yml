services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=demo-project
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  wiremock:
    image: wiremock/wiremock:3.4.2
    ports:
      - "8081:8080"
    volumes:
      - ./fixtures/mocks:/home/wiremock/mappings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # product-indexing — .NET Indexing API
  # Start with: make infra-product-indexing-up
  indexing-api:
    profiles: ["product-indexing"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.IndexingApi/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # dynamic-navigation — .NET NavigationApi (no Chrome — build ~2–3 min first time)
  # Start with: make infra-dynamic-navigation-up  (seeds configuration collection first)
  navigation-api:
    profiles: ["dynamic-navigation"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.ProductsDynamicNavigationApi/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
      configuration_project_id: demo-project
      configuration_table: (default)
      Neo_XMCloudApi_BaseUrl: http://wiremock:8080
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # search — .NET SearchApi (no Firestore — build ~2-3 min first time)
  # Start with: make infra-search-up
  search-api:
    profiles: ["search"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.SearchApi/Dockerfile
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # project-list — .NET ProjectListsApi (installs Chrome — first build ~15–20 min)
  # Start with: make infra-project-list-up  (seeds configuration + builds ProductsApi + ProjectListsApi)
  project-lists-api:
    profiles: ["project-list"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.ProjectListsApi/Dockerfile
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
      Firebase_Source_Project_Id: demo-project
      Firebase_Source_Project_Database_Id: "(default)"
      Firebase_Source_Product_Database_Id: "(default)"
      TOKEN_API_URL: http://wiremock:8080/oauth/token
      ProductApiBaseUrl: http://products-api:8080
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      products-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 120s

  # pdp + project-list — .NET ProductsApi (installs Chrome — first build ~15–20 min)
  products-api:
    profiles: ["pdp", "project-list"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.ProductsApi/Dockerfile
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
      configuration_project_id: demo-project
      configuration_table: (default)
      NeoXMCloudApiBaseUrl: http://wiremock:8080
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 24
      start_period: 120s

  # ── Batch B — Hybris-backed features ─────────────────────────────────────────
  # These services are scaffolded here; the .NET projects are built iteratively.
  # Each has its own named profile matching the feature directory in tests/.

  # shopping-cart — .NET ShoppingCartApi (port 8087)
  # Calls Hybris cart API + internal token service — both mocked via WireMock.
  # GoogleIdTokenHandler bypassed via INTEGRATION_TEST_MODE=true.
  # Start with: make infra-shopping-cart-up
  shopping-cart-api:
    profiles: ["shopping-cart"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.ShoppingCartApi/Dockerfile
    ports:
      - "8087:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      INTEGRATION_TEST_MODE: "true"
      # IShoppingCart (Hybris REST v2) base URL
      HttpConfiguration__BaseUrl: http://wiremock:8080
      # ITokenApi (internal Cloud Run token service) base URL — also WireMock
      HttpConfiguration__audience: http://wiremock:8080
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # my-account — .NET UserApi (port 8088)
  # Calls Hybris addresses + IDP JWKS (for RSA JWT validation) + Google Places — all via WireMock.
  # GoogleIdTokenHandler bypassed via INTEGRATION_TEST_MODE=true.
  # Auth: real RS256 JWT (see tests/my-account/conftest.py) validated against oidc-certs.json stub.
  # Start with: make infra-my-account-up
  user-api:
    profiles: ["my-account"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.UserApi/Dockerfile
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
      INTEGRATION_TEST_MODE: "true"
      HYBRIS_BASE_URL: http://wiremock:8080
      IDP_ENDPOINT: http://wiremock:8080
      TOKEN_API_URL: http://wiremock:8080
      GOOGLE_PLACES_URL: http://wiremock:8080
      GOOGLE_PLACES_APIKEY: test-api-key
      NEO_RECAPTCHA_ENDPOINT: http://wiremock:8080
      USER_INFO_TOKEN_ENDPOINT: http://wiremock:8080
      USER_INFO_ENDPOINT: http://wiremock:8080
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # pricing — .NET PricingApi (port 8089)
  # Calls Hybris pricing API + internal token service + IDP certs — all mocked via WireMock.
  # GoogleIdTokenHandler bypassed via INTEGRATION_TEST_MODE=true.
  # Start with: make infra-pricing-up
  pricing-api:
    profiles: ["pricing"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.PricingApi/Dockerfile
    ports:
      - "8089:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      INTEGRATION_TEST_MODE: "true"
      # IIdpTokenApi (IDP OIDC certs endpoint) — WireMock stub exists at /v1/sso/...
      IdpEndpoint: http://wiremock:8080
      # IProductDetail (ProductsApi for product data enrichment) — WireMock as placeholder
      HttpConfiguration__BaseUrl: http://wiremock:8080
      # ITokenApi (internal Cloud Run token service) base URL
      HttpConfiguration__audience: http://wiremock:8080
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # checkout — .NET OrderApi (port 8090) + PaymentApi (port 8091)
  # OrderApi: order history, order detail, order creation (Hybris cart→order flow).
  # PaymentApi: Adyen payment methods, credit card management.
  # Both: INTEGRATION_TEST_MODE=true bypasses GoogleIdTokenHandler GCP calls.
  # Start with: make infra-checkout-up
  order-api:
    profiles: ["checkout"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.OrderApi/Dockerfile
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      INTEGRATION_TEST_MODE: "true"
      HYBRIS_BASE_URL: http://wiremock:8080
      TOKEN_API_URL: http://wiremock:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  payment-api:
    profiles: ["checkout"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.PaymentApi/Dockerfile
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      INTEGRATION_TEST_MODE: "true"
      HYBRIS_BASE_URL: http://wiremock:8080
      TOKEN_API_URL: http://wiremock:8080
      IDP_ENDPOINT: http://wiremock:8080
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # forms — .NET FormsApi (port 8092)
  # No Firestore dependency. Calls Mulesoft CRM + reCAPTCHA via WireMock.
  # BYPASS_CAPTCHA_KEY + X-Bypass-Captcha header skip reCAPTCHA validation.
  # Start with: make infra-forms-up
  forms-api:
    profiles: ["forms"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.FormsApi/Dockerfile
    ports:
      - "8092:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      MULESOFT_BASE_URL: http://wiremock:8080
      MULESOFT_TOKEN_BASE_URL: http://wiremock:8080
      MULESOFT_TOKEN_CLIENT_ID: integration-test-client-id
      MULESOFT_TOKEN_CLIENT_SECRET: integration-test-client-secret
      MULESOFT_TOKEN_COOKIE: integration-test-cookie
      NEO_RECAPTCHA_ENDPOINT: http://wiremock:8080
      BYPASS_CAPTCHA_KEY: integration-test-bypass
    depends_on:
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  # store-locator — .NET StoreLocatorJob one-shot console job
  # Fetches store data from external API (WireMock), writes to stores-index-updates Firestore collection.
  # Runs once and exits (docker compose run --rm).
  # Start with: make infra-store-locator-up
  store-locator-job:
    profiles: ["store-locator"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.StoreLocatorJob/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FIRESTORE__SOURCE__PROJECTID: demo-project
      FIRESTORE__SOURCE__DATABASEID: "(default)"
      GCLOUD_PROJECT: demo-project
      USER_INFO_TOKEN_ENDPOINT: http://wiremock:8080
      USER_INFO_TOKEN_USER_ID: test-user-id
      USER_INFO_TOKEN_CLIENT_ID: test-client-id
      USER_INFO_TOKEN_CLIENT_SECRET: test-client-secret
      STORES_API_ENDPOINT: http://wiremock:8080
      STORES_INDEX_COLLECTION: stores-index-updates
      STORAGE_INDEX_DOMAIN_ID: test-domain-id
      LOCALES_TO_BE_EXECUTED: en-GB
      DEFAULT_TIME_FROM: "2024-01-01"
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy

  # redirections — .NET RedirectReverseProxy YARP reverse proxy (port 8093)
  # Looks up redirect rules from Firestore (redirects collection) and issues 301/302.
  # Passes through to WireMock (LoadBalancerAddress) for unmatched paths → WireMock returns 404.
  # NeoXMCloudApiBaseUrl + IntelligenceApiBaseUrl both point to WireMock.
  # Start with: make infra-redirections-up
  redirect-reverse-proxy:
    profiles: ["redirections"]
    build:
      context: ../grohe-neo-services
      dockerfile: src/GroheNeo.RedirectReverseProxy/Dockerfile
    ports:
      - "8093:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Integration
      ASPNETCORE_URLS: http://+:8080
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      GCLOUD_PROJECT: demo-project
      NeoXMCloudApiBaseUrl: http://wiremock:8080
      IntelligenceApiBaseUrl: http://wiremock:8080
      IP_INTELLIGENCE_API_KEY: test-key
      LoadBalancerAddress: http://wiremock:8080
      AcceptedHosts: "localhost|localhost:8080|localhost:8093"
    depends_on:
      firestore-emulator:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
